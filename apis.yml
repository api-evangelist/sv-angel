aid: sv-angel
name: SV Angel
description: >-
  SV Angel is a San Francisco-based venture capital firm founded in 2009 by Ron
  Conway, one of Silicon Valley's most prolific angel investors. The firm runs two
  vehicles: an early-stage Seed Fund that writes roughly $200k checks into pre-seed
  and seed rounds, and a later-stage Growth Fund that invests at Series B and beyond.
  SV Angel is a founder-first, high-conviction investor that deliberately does not
  lead rounds, takes no board seats, and writes smaller checks as part of a larger
  syndicate so it can act as a neutral "routing layer" and advocate for founders. It
  is famous for its "Inflection Point Approach" — showing up at critical moments
  around fundraising, M&A, and business development. The firm invests almost entirely
  in US-based, software-driven companies across consumer and enterprise, and its
  portfolio has produced dozens of unicorns and landmark outcomes including Google,
  Airbnb, Coinbase, Stripe, Slack, Instacart, DoorDash, Reddit, Pinterest, GitHub,
  Databricks, Anthropic, and OpenAI.
